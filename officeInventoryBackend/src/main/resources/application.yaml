spring:
  application:
    name: Inventory

  datasource:
    url: jdbc:postgresql://localhost:5432/office_inventory
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 9001